name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # UN CUELGUE TIENE QUE FALLAR FUERTE Y RÁPIDO, NO ARDER SEIS HORAS.
    #
    # Sin este tope, el job corría hasta que GitHub lo mataba a las 6 h y
    # terminaba como "cancelled", que se lee igual que si alguien lo hubiera
    # cancelado a mano. Así estuvo el pipeline desde el 28/08 sin que nadie lo
    # notara: los tests pasaban, vitest no salía nunca, y el resultado no era
    # rojo sino ambiguo. La suite entera tarda menos de dos minutos.
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["18.x", "20.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read-only guard (sin POST/PUT/PATCH/DELETE)
        run: npm run check:readonly

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # El benchmark del enrutador (V5.3): un score, no un pass/fail por frase.
      # El corpus son mensajes reales; si un cambio lo baja del 95%, no entra.
      - name: Evals del enrutador (score >= 95%)
        run: node scripts/evals-enrutador.mjs --min 95
